[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-sprites"
version = "0.1.0"
description = "Sprites tools for LlamaIndex agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sprites Team" }]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.14.0,<0.15",
    "sprites-py>=0.5.0,<1",
]

[project.urls]
Homepage = "https://sprites.dev"
Documentation = "https://docs.sprites.dev"
Repository = "https://github.com/superfly/llama-index-tools-sprites"
Issues = "https://github.com/superfly/llama-index-tools-sprites/issues"

[tool.llamahub]
contains_example = true
import_path = "llama_index.tools.sprites"

[tool.llamahub.class_authors]
SpritesToolSpec = "superfly"

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.11,<0.14",
]
examples = [
    "llama-index-llms-openai>=0.7,<0.8",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
explicit_package_bases = true
follow_imports = "skip"
ignore_missing_imports = true
namespace_packages = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
